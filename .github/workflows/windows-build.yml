
name: Windows v0.8 Beta installer

on:
  workflow_dispatch:
  push:
    branches:
      - develop-v0.8

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m compileall -q main.py achievement_editor.py achievement_core

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name AchievementManager --add-data "app_config.json;." --hidden-import keyring.backends.Windows main.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\setup.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AchievementManager-v0.8-Beta
          path: dist-installer/*.exe
          if-no-files-found: error
